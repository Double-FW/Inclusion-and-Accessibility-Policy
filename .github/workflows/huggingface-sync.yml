name: Update Disability Inclusion and Accessibility Policy Hugging Face dataset

on:
  schedule:
    - cron: '47 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inclusion-policy-huggingface-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Double-FW/Inclusion-and-Accessibility-Policy' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install publishing dependencies
        run: python -m pip install -r huggingface/requirements.txt
      - name: Check repository sources and public-reference access
        run: python scripts/check_repository.py --live-links
      - name: Test current-source export and publishing safeguards
        run: python -m unittest discover -s tests -p 'test_policy_huggingface.py' -v
      - name: Build and validate Disability Inclusion and Accessibility Policy dataset
        run: python scripts/export_huggingface.py --output "${RUNNER_TEMP}/inclusion-policy-dataset"
      - name: Explain publication hold
        run: echo 'Publication is paused pending repository review and first-sync setup.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish Disability Inclusion and Accessibility Policy dataset
        if: ${{ false }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_huggingface.py --folder "${RUNNER_TEMP}/inclusion-policy-dataset"
